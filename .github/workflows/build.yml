name: Build APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      # Regenerate gradle wrapper to ensure valid JAR
      - name: Setup Gradle Wrapper
        run: |
          cd app
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          cd ..
          chmod +x gradlew
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: 'true'
          packages: 'platforms;android-34 build-tools;34.0.0'
      - name: Print versions
        run: |
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms dir"
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: inkrun-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk